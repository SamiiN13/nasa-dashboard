<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

    <header>
        <h1>🚀 NASA Space Dashboard</h1>
        <p>Live data from NASA's open APIs</p>
    </header>

    <main>

        <!-- Stats Bar -->
        <div id="stats-bar">
            <div class="stat">
                <span class="stat-number" id="total-count">-</span>
                <span class="stat-label">Asteroids This Week</span>
            </div>
            <div class="stat">
                <span class="stat-number hazard-number" id="hazard-count">-</span>
                <span class="stat-label">Potentially Hazardous</span>
            </div>
            <div class="stat">
                <span class="stat-number" id="closest">-</span>
                <span class="stat-label">Closest Approach (km)</span>
            </div>
        </div>

        <!-- APOD Section -->
        <section id="apod-section">
            <h2>Astronomy Picture of the Day</h2>
            <div id="apod-container">
                <p>Loading...</p>
            </div>
        </section>

        <!-- Asteroid Chart -->
        <section id="chart-section">
            <h2>Asteroid Size Comparison</h2>
            <canvas id="asteroidChart"></canvas>
        </section>

        <!-- Asteroids Section -->
        <section id="asteroid-section">
            <h2>Near-Earth Asteroids This Week</h2>
            <div id="asteroid-container">
                <p>Loading...</p>
            </div>
        </section>

    </main>

    <footer>
        <p>Data sourced from <a href="https://api.nasa.gov" target="_blank">NASA Open APIs</a> · Built by Samiha</p>
    </footer>

    <script src="/static/app.js"></script>

</body>
</html>
